[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "mallangmollang"
version = "0.1.0"
description = "AI 하이브리드 화면 번역 유틸리티"
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.6",
    "pytesseract>=0.3",
    "Pillow>=10.0",
    "opencv-python>=4.8",
    "httpx>=0.25",
    "imagehash>=4.3",
    "mss>=9.0",
    "pynput>=1.7",
    "cryptography>=41.0",
]

[project.scripts]
mallangmollang = "mallangmollang.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mallangmollang*"]
